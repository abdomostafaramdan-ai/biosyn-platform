<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="strict-origin-when-cross-origin"><title>اتفاقية محاضر | Biosyn Egypt</title><link rel="icon" href="img/biosyn-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><link rel="stylesheet" href="css/contract.css">
<style>body{margin:0;background:#eef0f8;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#1a1d3a}.kc-bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 16px;background:#010232;color:#fff}.kc-bar b{font-size:15px}.kc-bar div{display:flex;gap:8px;flex-wrap:wrap}.kc-bar button,.kc-bar a{font:600 14px/1 inherit;padding:10px 14px;border-radius:10px;border:0;cursor:pointer;text-decoration:none;background:#c6f84a;color:#010232}.kc-bar .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)}.kc-print{padding:24px 12px 60px}.kc-print .kc-doc{box-shadow:0 10px 40px rgba(1,2,50,.12);border-radius:6px}.kc-msg{max-width:560px;margin:80px auto;text-align:center;font-size:16px}</style>
</head><body>
<div class="kc-bar"><b>اتفاقية محاضر · Biosyn Egypt</b><div><button type="button" id="k-print">طباعة / حفظ PDF</button><a id="k-pdf" class="ghost" hidden target="_blank" rel="noopener">النسخة الأصلية PDF</a><a class="ghost" href="javascript:history.back()">رجوع</a></div></div>
<div class="kc-print" id="doc"><p class="kc-msg">جارٍ التحميل…</p></div>
<script src="js/config.js"></script><script src="js/sb.js"></script><script src="js/contract.js?v=2"></script>
<script>
(async function () {
  const box = document.getElementById('doc'), id = new URLSearchParams(location.search).get('id') || '';
  document.getElementById('k-print').onclick = () => window.print();
  if (!/^[0-9a-f-]{36}$/.test(id)) { box.innerHTML = '<p class="kc-msg">رابط الاتفاقية غير صحيح.</p>'; return; }
  if (!sb.session) { location.href = 'login.html?next=' + encodeURIComponent('contract.html?id=' + id); return; }
  try {
    await sb.auth.ready;
    const c = await sb.one('contracts', { select: '*', id: 'eq.' + id });
    if (!c) { box.innerHTML = '<p class="kc-msg">لم نعثر على هذه الاتفاقية، أو أنها غير متاحة لحسابك.</p>'; return; }
    const t = await sb.one('contract_templates', { select: 'title', id: 'eq.' + c.template_id }).catch(() => null);
    c.title = (t && t.title) || 'اتفاقية محاضر';
    document.title = c.title + ' · ' + c.signer_name;
    box.innerHTML = window.contractDoc(c);
    if (c.pdf_path) { const a = document.getElementById('k-pdf'); a.href = await sb.storage.signedUrl('contracts', c.pdf_path, 600); a.hidden = false; }
  } catch (e) { box.innerHTML = '<p class="kc-msg">تعذّر تحميل الاتفاقية.</p>'; }
})();
</script></body></html>
